version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garro_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - garro_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  mongodb:
    image: mongo:7.0
    container_name: garro_mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017" # Exposed to localhost only for security
    volumes:
      - mongo_data:/data/db
    networks:
      - garro_net

volumes:
  mongo_data:
    driver: local

networks:
  garro_net:
    driver: bridge
